[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for schema-driven ingestion and dashboards"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*starlette.testclient.*",
    "ignore:.*anyio.abc.BlockingPortal.*"
]
